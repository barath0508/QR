      <circle cx="215" cy="90" r="5" fill="#064e3b" />
      <circle cx="245" cy="90" r="5" fill="#064e3b" />

      <circle cx="15" cy="115" r="5" fill="#064e3b" />
      <circle cx="70" cy="115" r="5" fill="#064e3b" />
      <circle cx="105" cy="115" r="5" fill="#10b981" />
