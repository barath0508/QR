      <circle cx="170" cy="235" r="5" fill="#10b981" />
      <circle cx="215" cy="235" r="5" fill="#064e3b" />
      <circle cx="255" cy="235" r="5" fill="#064e3b" />

      <circle cx="90" cy="260" r="5" fill="#064e3b" />
      <circle cx="120" cy="260" r="5" fill="#064e3b" />
      <circle cx="150" cy="260" r="5" fill="#064e3b" />
      <circle cx="190" cy="260" r="5" fill="#064e3b" />
      <circle cx="225" cy="260" r="5" fill="#064e3b" />
      <circle cx="250" cy="260" r="5" fill="#064e3b" />

      <!-- Center Brand Badge / Quiet Zone -->
      <rect x="100" y="100" width="70" height="70" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2.5" />
      <rect x="110" y="110" width="50" height="50" rx="10" fill="#042f2e" />
      <text x="135" y="142" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" text-anchor="middle">QR</text>
    </g>

    <!-- Scan Status Footer -->
    <rect x="30" y="345" width="300" height="36" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <circle cx="48" cy="363" r="4" fill="#10b981" />
    <text x="60" y="367" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Scan Ready • Error Correction Level H (30%)</text>
