      <circle cx="85" cy="140" r="5" fill="#064e3b" />
      <circle cx="185" cy="140" r="5" fill="#064e3b" />
      <circle cx="215" cy="140" r="5" fill="#064e3b" />
      <circle cx="240" cy="140" r="5" fill="#064e3b" />

      <circle cx="15" cy="165" r="5" fill="#064e3b" />
      <circle cx="50" cy="165" r="5" fill="#064e3b" />
      <circle cx="80" cy="165" r="5" fill="#10b981" />
      <circle cx="115" cy="165" r="5" fill="#064e3b" />
