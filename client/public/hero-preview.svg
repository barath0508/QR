      <rect x="0" y="0" width="70" height="70" rx="14" fill="#064e3b" />
      <rect x="10" y="10" width="50" height="50" rx="8" fill="#ffffff" />
      <rect x="20" y="20" width="30" height="30" rx="6" fill="#10b981" />

      <!-- Top-Right Position Eye Outer -->
      <rect x="200" y="0" width="70" height="70" rx="14" fill="#064e3b" />
      <rect x="210" y="10" width="50" height="50" rx="8" fill="#ffffff" />
      <rect x="220" y="20" width="30" height="30" rx="6" fill="#10b981" />

