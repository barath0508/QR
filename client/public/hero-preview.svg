<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#10b981" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="300" fill="url(#accentGlow)" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="350" fill="url(#accentGlow)" filter="blur(70px)" />

  <!-- Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200 M0 420 H1200 M0 490 H1200 M0 560 H1200" />
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630" />
  </g>

  <!-- Main Container Card -->
  <rect x="80" y="55" width="1040" height="520" rx="24" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Window Top Bar -->
  <rect x="80" y="55" width="1040" height="50" rx="24" fill="#090d16" fill-opacity="0.8" />
  <rect x="80" y="85" width="1040" height="20" fill="#090d16" fill-opacity="0.8" />
  <circle cx="115" cy="80" r="6" fill="#ef4444" opacity="0.85" />
  <circle cx="135" cy="80" r="6" fill="#f59e0b" opacity="0.85" />
  <circle cx="155" cy="80" r="6" fill="#10b981" opacity="0.85" />
  <text x="600" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.5">QRLoop Dynamic Studio — Real-Time Scan Telemetry &amp; Vector Generator</text>

  <!-- Left Column: Interactive QR Generator Controls Mockup -->
  <g transform="translate(120, 135)">
    <!-- Active Pill Badge -->
    <rect width="180" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="28" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">LIFETIME REDIRECT</text>

    <!-- Main Title Inside Preview -->
    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">Dynamic QR Studio</text>
    <text x="0" y="92" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400">Edit destination URLs after printing • Sub-50ms edge redirects</text>

    <!-- Destination Input Mockup -->
    <rect y="120" width="480" height="48" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    <text x="18" y="150" fill="#64748b" font-family="monospace" font-size="13">https://yourbrand.com/summer-campaign-2026</text>
    <rect x="400" y="128" width="68" height="32" rx="8" fill="#10b981" />
    <text x="434" y="149" fill="#042f2e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">EDIT</text>

    <!-- Style Selector Chips -->
    <text x="0" y="200" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Module Dot Styling</text>
    <g transform="translate(0, 212)">
      <rect width="105" height="36" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
      <text x="52" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Smooth Dots</text>

      <rect x="115" width="105" height="36" rx="10" fill="#090d16" stroke="#334155" stroke-width="1" />
      <text x="167" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Rounded</text>

      <rect x="230" width="105" height="36" rx="10" fill="#090d16" stroke="#334155" stroke-width="1" />
      <text x="282" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Class Block</text>

      <rect x="345" width="105" height="36" rx="10" fill="#090d16" stroke="#334155" stroke-width="1" />
      <text x="397" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pill Shapes</text>
    </g>

    <!-- Live Telemetry KPI row -->
    <g transform="translate(0, 275)">
      <rect width="145" height="70" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">TOTAL SCANS</text>
      <text x="16" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">14,892</text>

      <rect x="155" width="145" height="70" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="171" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">UNIQUE VISITORS</text>
      <text x="171" y="52" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">11,240</text>

      <rect x="310" width="170" height="70" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="326" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">EDGE REDIRECT</text>
      <text x="326" y="52" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">32ms SLA</text>
    </g>

    <!-- Export Action Buttons -->
    <g transform="translate(0, 368)">
      <rect width="145" height="42" rx="12" fill="url(#brandGrad)" />
      <text x="72" y="26" fill="#022c22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Export Vector SVG</text>

      <rect x="155" width="145" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="227" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Print A4 PDF</text>

      <rect x="310" width="145" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="382" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">HD 300DPI PNG</text>
    </g>
  </g>

  <!-- Right Column: Stylized Vector QR Code Canvas Mockup -->
