      <circle cx="195" cy="165" r="5" fill="#064e3b" />
      <circle cx="230" cy="165" r="5" fill="#064e3b" />
      <circle cx="260" cy="165" r="5" fill="#064e3b" />

      <circle cx="95" cy="205" r="5" fill="#064e3b" />
      <circle cx="125" cy="205" r="5" fill="#064e3b" />
      <circle cx="160" cy="205" r="5" fill="#064e3b" />
      <circle cx="200" cy="205" r="5" fill="#064e3b" />
